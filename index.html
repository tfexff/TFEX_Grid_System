/* Customer 360 experience */
.customer-hero{background:linear-gradient(120deg,#102736,#143746 72%,#124c3e);color:#fff;border-radius:16px;padding:23px 25px;margin-bottom:16px;display:flex;gap:20px;justify-content:space-between;align-items:center;box-shadow:0 12px 32px rgba(12,37,49,.10)}
.customer-hero .profile-icon{background:#ffffff20;color:#b2f3d8;border:1px solid #ffffff25;width:56px;height:56px}
.customer-hero .page-title{color:white}.customer-hero .profile-meta{color:#b7ccd0}.customer-hero .eyebrow{color:#88e7be}.customer-hero .badge{background:#ffffff16;color:#b6fae0;border:1px solid #ffffff24}
.customer-hero .btn{background:#ffffff12;color:white;border-color:#ffffff38}.customer-hero .btn:hover{background:#ffffff27}
.hero-info{display:flex;gap:17px;flex-wrap:wrap;color:#cee0e2;font-size:11px;margin-top:12px}.hero-info strong{color:#fff}
.hero-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.c360-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:21px 0 11px}.c360-title h3{margin:0;font-size:14px;font-weight:850}.c360-title span{font-size:11px;color:#8291a0}

.c360-callout{background:#f7fafc;border:1px solid #e5edf0;border-radius:12px;padding:12px 15px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}
.c360-callout b{font-size:12px}.c360-callout p{font-size:11px;color:#718797;margin:3px 0 0}.c360-callout .mark{border-radius:6px;font-size:10px;font-weight:850;padding:5px 9px;background:#edf7f2;color:#19865f}
.portfolio-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:11px;margin-bottom:15px}.port-card{background:white;border:1px solid var(--border);border-radius:13px;padding:15px;text-align:left;min-width:0;transition:background .2s,border-color .2s,transform .2s}.port-card:hover{background:#fbfefc;border-color:#a8d9c3;transform:translateY(-1px)}.port-card.active{border-color:#31b589;box-shadow:0 0 0 2px #2db38e24}
.port-top{display:flex;gap:10px;justify-content:space-between;align-items:center}.port-id{color:#233b4c;font-size:13px;font-weight:850}.port-sub{font-size:10px;color:#8b9aa6;margin-top:1px}.port-details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.port-details small{font-size:10px;color:#8a98a5;display:block}.port-details b{display:block;font-size:11px;color:#324c5c;margin-top:2px;font-weight:750}.port-bottom{margin-top:13px;padding-top:10px;border-top:1px solid #eef2f4;display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#668377}
.c360-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:14px}.calendar-grid{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:5px;margin-top:14px}.calendar-cell{height:22px;border-radius:5px;background:#edf1f4;display:flex;align-items:center;justify-content:center;font-size:9px;color:#a6b1bb}.calendar-cell.on{background:#55bb91;color:#fff}.calendar-cell.partial{background:#c1ead8;color:#31795b}.calendar-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:11px;color:#8594a0;font-size:10px}.calendar-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}

@media(max-width:720px){.customer-hero{padding:17px;flex-direction:column;align-items:stretch}.hero-actions{justify-content:flex-start}.c360-quick{grid-template-columns:repeat(2,minmax(0,1fr))}.quickcell{padding:10px}.last-run-spot .big-time{font-size:19px}.c360-two{grid-template-columns:1fr}.calendar-cell{height:18px}.hero-info{gap:8px}}


/* Customer 360 — trading extensions (demo only) */

function rngMaker(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}

const iconPaths={overview:'<rect x="3" y="3" width="8" height="8" rx="1.6"/><rect x="13" y="3" width="8" height="8" rx="1.6"/><rect x="3" y="13" width="8" height="8" rx="1.6"/><rect x="13" y="13" width="8" height="8" rx="1.6"/>',customers:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',license:'<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 8.7-8.7 2 2-2.1 2.1 1.2 1.2-2.6 2.6-1.4-1.4-3.9 3.9"/>',analytics:'<path d="M3 3v18h18"/><path d="m7 15 4-5 4 3 5-7"/>',online:'<path d="M2 8a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="20" r="1"/>',play:'<circle cx="12" cy="12" r="10"/><path d="m10 8 6 4-6 4V8Z"/>',check:'<circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/>',pending:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',stop:'<circle cx="12" cy="12" r="10"/><rect x="9" y="9" width="6" height="6" rx="1"/>',new:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M16 11h6"/>',alert:'<path d="m10.3 3.8-8.6 15a2 2 0 0 0 1.7 3h17.2a2 2 0 0 0 1.7-3l-8.6-15a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l3 2"/>',download:'<path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M5 17v4h14v-4"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',right:'<path d="m9 18 6-6-6-6"/>',left:'<path d="m15 18-6-6 6-6"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 11v5"/><path d="M12 7h.01"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',bot:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 4v4M9 4h6"/><circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/><path d="M8 18h8"/>',arrow:'<path d="m5 12 14 0m-6-6 6 6-6 6"/>',filter:'<path d="M4 7h16M7 12h10M10 17h4"/>',refresh:'<path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5 9a7 7 0 0 1 12-3 function generateData(){
 for(let i=1;i<=86;i++){

   if(!ever) {acc.online=expiry>=TODAY&&rnd()<.32;acc.heartbeat=acc.online?new Date(TODAY.getTime()-random(0,70)*1000):new Date(TODAY.getTime()-random(30,300)*60000);continue;}

   acc.running=mode==='running';acc.online=mode!=='stopped';acc.heartbeat=acc.online?new Date(TODAY.getTime()-random(5,90)*1000):new Date(TODAY.getTime()-random(9,125)*60000);

   const usableDays=Math.max(0,maxDays-stopGap);
   const qty=Math.max(1,Math.min(36,random(2,14),usableDays+1));

 const apply=e.target.closest('#applyCustom');if(apply){const st=$('#startDate').value,en=$('#endDate').value;if(!st||!en){alert('กรุณาระบุวันที่เริ่มต้นและสิ้นสุด');return}const start=new Date(st+'T00:00:00'),end=new Date(en+'T23:59:59');const n=(end-start)/DAY;if(n<0||n>90){alert('ช่วงวันที่ต้องไม่เกิน 90 วัน และวันเริ่มต้นต้องไม่เกินวันสิ้นสุด');return}if(startDay(end)>startDay(TODAY)){alert('ไม่สามารถเลือกวันในอนาคตได้');return}state.customStart=st;state.customEnd=en;state.detailAllHistory=false;render();return;}
});
document.addEventListener('keydown',e=>{const x=e.target.closest('[data-jump]');if(x&&(e.key==='Enter'||e.key===' ')){e.preventDefault();x.click();}});
document.addEventListener('input',e=>{if(e.target.id==='customerSearch'){state.customerQuery=e.target.value;renderCustomerTable()}if(e.target.id==='licenseSearch'){state.licenseQuery=e.target.value;renderLicenseTable()}});
document.addEventListener('change',e=>{if(e.target.id==='customerFilter'){state.customerFilter=e.target.value;renderCustomerTable()}if(e.target.id==='customerSort'){state.sort=e.target.value;renderCustomerTable()}if(e.target.id==='licenseFilter'){state.licenseFilter=e.target.value;renderLicenseTable()}if(e.target.id==='detailPort'){state.detailPort=e.target.value;state.detailRun=null;renderDetail()}});
$('#nowLabel').textContent=thDate(TODAY,{weekday:'short',day:'numeric',month:'short'});
render();
</script>
